[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gppo-world"
version = "0.1.0"
description = "Action-conditioned event-aware graph world model for GPPO"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["gppo_world*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
